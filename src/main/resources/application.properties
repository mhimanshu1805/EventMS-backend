spring.datasource.url=jdbc:postgresql://localhost:5432/ems_db
spring.datasource.username=${DB_USERNAME:himanshu}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Poster uploads: reject anything larger before the controller runs.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# JWT: HS256 needs a secret of at least 32 characters. Override in production via JWT_SECRET.
ems.jwt.secret=${JWT_SECRET:change-me-to-a-32-char-minimum-secret!!}
ems.jwt.expiration-ms=86400000

# Seeded MAIN_ADMIN if none exists yet. Override via env vars.
ems.admin.email=${ADMIN_EMAIL:admin@ems.local}
ems.admin.password=${ADMIN_PASSWORD:Admin@123}
ems.admin.name=${ADMIN_NAME:Main Admin}

# Public event page prefix encoded in QR codes: {base}/events/{slug}
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}
